<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계약서 보안 관리 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 18px; font-weight: bold; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }
        .page-section { display: none; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .page-section.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 4px; }
        
        button.btn-primary { background: var(--accent-color); color: #0f172a; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        button.btn-secondary { background: #10b981; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        
        .hidden { display: none !important; }

        /* ================= 인쇄용 양식 (사진 재현) ================= */
        #print-receipt-zone { display: none; background: white; color: black; padding: 40px; border: 1px solid #ccc; max-width: 900px; margin: 20px auto; }
        .print-header { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .receipt-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .receipt-table th, .receipt-table td { border: 1px solid #000; padding: 8px 12px; color: black; font-size: 15px; text-align: left; }
        .receipt-table th { background-color: #fff; width: 180px; font-weight: bold; }
        .receipt-table td { background-color: #fff; }
        
        .flex-td { display: flex; justify-content: space-between; border: none !important; padding: 0 !important; }
        .flex-td span { flex: 1; border-right: 1px dotted #000; padding: 0 10px; text-align: center; }
        .flex-td span:last-child { border-right: none; }
        
        .req-mark::before { content: '■ '; color: #000; }

        @media print {
            body * { visibility: hidden; }
            #print-receipt-zone, #print-receipt-zone * { visibility: visible; }
            #print-receipt-zone { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none; }
            @page { size: A4 portrait; margin: 15mm; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="login-section" style="max-width: 400px; margin: 100px auto; background: var(--panel-bg); padding: 40px; border-radius: 12px; text-align: center;">
        <h2 style="margin-bottom: 20px;">시스템 로그인</h2>
        <input type="email" id="login-email" placeholder="이메일" style="margin-bottom:10px;">
        <input type="password" id="login-password" placeholder="비밀번호" style="margin-bottom:20px;">
        <button class="btn-primary" onclick="handleLogin()">인증 및 접속</button>
    </div>

    <div id="main-system" class="hidden">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('input')">계약서 등록 (입력)</button>
            <button class="tab-btn" onclick="switchTab('list')">목록 검색</button>
        </div>

        <div id="section-input" class="page-section active">
            <form id="contract-form" onsubmit="saveContract(event)">
                <div class="form-row">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>*기안문/문서번호/기안일자</label>
                        <div style="display:flex; gap:5px;">
                            <select id="doc_dept" required style="flex:1;">
                                <option value="미디어경">미디어경</option>
                                <option value="미디어전">미디어전</option>
                                <option value="미디어해">미디어해</option>
                                <option value="미디어국">미디어국</option>
                                <option value="미디어플">미디어플</option>
                                <option value="미디어제">미디어제</option>
                                <option value="미디어문">미디어문</option>
                                <option value="미디어감">미디어감</option>
                            </select>
                            <input type="number" id="doc_year" placeholder="2026" required style="flex:1;">
                            <input type="number" id="doc_num" placeholder="번호" required style="flex:0.7;">
                            <input type="date" id="draft_date" required style="flex:1.3;">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*기안자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="drafter_dept" placeholder="소속" required><input type="text" id="drafter_name" placeholder="성함" required></div>
                    </div>
                    <div class="form-group"><label>*검토자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="reviewer_dept" placeholder="소속" required><input type="text" id="reviewer_name" placeholder="성함" required></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*최종결재자</label><input type="text" id="approver" placeholder="예: 사장" required></div>
                    <div class="form-group"><label>*계약 제목</label><input type="text" id="title" required></div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="grid-column: span 2;"><label>*계약 상대방 (쉼표로 구분)</label><input type="text" id="parties" placeholder="법무법인 OO, 법무법인 XX" required></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*계약 개시일</label><input type="date" id="start_date" required></div>
                    <div class="form-group"><label>*계약 종료일(조건)</label>
                        <div style="display:flex; gap:5px;"><input type="date" id="end_date" required><input type="text" id="end_condition" placeholder="예: 1심 종료"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*자동갱신 여부 (Y/N)</label><select id="auto_renew"><option value="Y">Y</option><option value="N">N</option></select></div>
                    <div class="form-group"><label>갱신 통보 일자</label><input type="text" id="renew_notice" placeholder="예: 2심 항소 기간 이내"></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*날인 일자 및 일련번호</label>
                        <div style="display:flex; gap:5px;"><input type="date" id="sign_date" required><input type="text" id="sign_num" placeholder="001" required></div>
                    </div>
                    <div class="form-group"><label>*원본 날인자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="signer_dept" required><input type="text" id="signer_name" required></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*원본 보관자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="keeper_dept" required><input type="text" id="keeper_name" required></div>
                    </div>
                    <div class="form-group"><label>*파일 작성자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="file_drafter_dept" required><input type="text" id="file_drafter_name" required></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*파일 보관자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="file_keeper_dept" required><input type="text" id="file_keeper_name" required></div>
                    </div>
                    <div class="form-group"><label>*작성시점 관리자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text" id="manager_dept" required><input type="text" id="manager_name" required></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>*계약서 파일(PDF)</label>
                    <input type="file" id="contract_file" required>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn-primary">정보 저장</button>
                    <button type="button" class="btn-secondary hidden" id="btn-print-receipt" onclick="window.print()">🖨️ 양식 인쇄</button>
                </div>
            </form>

            <div id="print-receipt-zone">
                <p class="print-header">■ 표시된 항목은 필수 입력임.</p>
                <table class="receipt-table">
                    <tr>
                        <th class="req-mark">기안문</th>
                        <td colspan="2">
                            <div class="flex-td">
                                <span id="p-doc-dept">미디어전</span>
                                <span id="p-doc-num-full">2026-0001</span>
                                <span id="p-draft-date">2026.1.2.</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th class="req-mark">기안자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-drafter-dept"></span><span id="p-drafter-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">검토자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-reviewer-dept"></span><span id="p-reviewer-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">최종 결재자</th>
                        <td colspan="2" id="p-approver" style="text-align:center;"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">계약 제목</th>
                        <td colspan="2" id="p-title"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">계약 상대방</th>
                        <td colspan="2" id="p-parties"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">계약 개시일</th>
                        <td colspan="2" id="p-start-date" style="text-align:center;"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">계약 종료일 (종료 조건)</th>
                        <td colspan="2">
                            <div class="flex-td">
                                <span id="p-end-date"></span>
                                <span id="p-end-condition"></span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th class="req-mark">자동갱신 여부</th>
                        <td colspan="2">
                            <div style="display:flex; justify-content: space-around;">
                                <span>Y <input type="checkbox" id="p-auto-y"></span>
                                <span>N <input type="checkbox" id="p-auto-n"></span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>갱신 통보 일자</th>
                        <td colspan="2" id="p-renew-notice" style="text-align:center;"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">원본 날인자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-signer-dept"></span><span id="p-signer-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">날인 일자 및 일련번호</th>
                        <td colspan="2">
                            <div class="flex-td">
                                <span id="p-sign-date"></span>
                                <span id="p-sign-num"></span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th class="req-mark">원본 보관자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-keeper-dept"></span><span id="p-keeper-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">파일 작성자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-f-drafter-dept"></span><span id="p-f-drafter-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">파일 보관자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-f-keeper-dept"></span><span id="p-f-keeper-name"></span></div></td>
                    </tr>
                    <tr>
                        <th class="req-mark">양식 작성일</th>
                        <td colspan="2" id="p-create-date" style="text-align:center;"></td>
                    </tr>
                    <tr>
                        <th class="req-mark">양식 작성시점 관리자</th>
                        <td colspan="2"><div class="flex-td"><span id="p-manager-dept"></span><span id="p-manager-name"></span></div></td>
                    </tr>
                </table>
            </div>
        </div>

        <div id="section-list" class="page-section">
             <input type="text" id="search-keyword" placeholder="검색어 입력..." style="margin-bottom:10px; width:80%;">
             <button class="btn-primary" style="width:18%;" onclick="loadContracts()">검색</button>
             <div id="contract-list-target"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dqdcoisbtqbkytzvyfct.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iAeHQcv6_WxXqQvZ3FLWWg_7xN66R6O";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 날짜 포맷 함수 (2026.1.2. 형태)
    function formatDate(dateStr) {
        if(!dateStr) return "";
        const d = new Date(dateStr);
        return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}.`;
    }

    // 오늘 날짜 자동 설정
    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('draft_date').value = today;
        document.getElementById('p-create-date').innerText = formatDate(today);
    };

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) alert("로그인 실패");
        else {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-system').classList.remove('hidden');
        }
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn, .page-section').forEach(el => el.classList.remove('active'));
        if(type==='input') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('section-input').classList.add('active');
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('section-list').classList.add('active');
            loadContracts();
        }
    }

    async function saveContract(e) {
        e.preventDefault();
        
        // 1. 데이터 수집 및 인쇄 레이아웃 매핑
        const data = {
            doc_dept: document.getElementById('doc_dept').value,
            doc_full: `${document.getElementById('doc_year').value}-${document.getElementById('doc_num').value}`,
            draft_date: document.getElementById('draft_date').value,
            drafter_dept: document.getElementById('drafter_dept').value,
            drafter_name: document.getElementById('drafter_name').value,
            reviewer_dept: document.getElementById('reviewer_dept').value,
            reviewer_name: document.getElementById('reviewer_name').value,
            approver: document.getElementById('approver').value,
            title: document.getElementById('title').value,
            parties: document.getElementById('parties').value,
            start_date: document.getElementById('start_date').value,
            end_date: document.getElementById('end_date').value,
            end_condition: document.getElementById('end_condition').value,
            auto_renew: document.getElementById('auto_renew').value,
            renew_notice: document.getElementById('renew_notice').value,
            signer_dept: document.getElementById('signer_dept').value,
            signer_name: document.getElementById('signer_name').value,
            sign_date: document.getElementById('sign_date').value,
            sign_num: document.getElementById('sign_num').value,
            keeper_dept: document.getElementById('keeper_dept').value,
            keeper_name: document.getElementById('keeper_name').value,
            file_drafter_dept: document.getElementById('file_drafter_dept').value,
            file_drafter_name: document.getElementById('file_drafter_name').value,
            file_keeper_dept: document.getElementById('file_keeper_dept').value,
            file_keeper_name: document.getElementById('file_keeper_name').value,
            manager_dept: document.getElementById('manager_dept').value,
            manager_name: document.getElementById('manager_name').value,
            create_date: new Date().toISOString().split('T')[0]
        };

        // 2. 인쇄 화면에 값 채우기
        document.getElementById('p-doc-dept').innerText = data.doc_dept;
        document.getElementById('p-doc-num-full').innerText = data.doc_full;
        document.getElementById('p-draft-date').innerText = formatDate(data.draft_date);
        document.getElementById('p-drafter-dept').innerText = data.drafter_dept;
        document.getElementById('p-drafter-name').innerText = data.drafter_name;
        document.getElementById('p-reviewer-dept').innerText = data.reviewer_dept;
        document.getElementById('p-reviewer-name').innerText = data.reviewer_name;
        document.getElementById('p-approver').innerText = data.approver;
        document.getElementById('p-title').innerText = data.title;
        document.getElementById('p-parties').innerText = data.parties;
        document.getElementById('p-start-date').innerText = formatDate(data.start_date);
        document.getElementById('p-end-date').innerText = formatDate(data.end_date);
        document.getElementById('p-end-condition').innerText = data.end_condition;
        document.getElementById('p-auto-y').checked = data.auto_renew === 'Y';
        document.getElementById('p-auto-n').checked = data.auto_renew === 'N';
        document.getElementById('p-renew-notice').innerText = data.renew_notice;
        document.getElementById('p-signer-dept').innerText = data.signer_dept;
        document.getElementById('p-signer-name').innerText = data.signer_name;
        document.getElementById('p-sign-date').innerText = formatDate(data.sign_date);
        document.getElementById('p-sign-num').innerText = data.sign_num;
        document.getElementById('p-keeper-dept').innerText = data.keeper_dept;
        document.getElementById('p-keeper-name').innerText = data.keeper_name;
        document.getElementById('p-f-drafter-dept').innerText = data.file_drafter_dept;
        document.getElementById('p-f-drafter-name').innerText = data.file_drafter_name;
        document.getElementById('p-f-keeper-dept').innerText = data.file_keeper_dept;
        document.getElementById('p-f-keeper-name').innerText = data.file_keeper_name;
        document.getElementById('p-manager-dept').innerText = data.manager_dept;
        document.getElementById('p-manager-name').innerText = data.manager_name;

        // 3. 파일 업로드 로직 (기존 유지)
        const file = document.getElementById('contract_file').files[0];
        const filePath = `contracts/${Date.now()}_${file.name}`;
        await supabase.storage.from('contract-files').upload(filePath, file);
        const { data: { publicUrl } } = supabase.storage.from('contract-files').getPublicUrl(filePath);
        data.file_url = publicUrl;

        // 4. DB 저장
        const { error } = await supabase.from('contracts').insert([data]);
        if (error) alert("저장 실패: " + error.message);
        else {
            alert("저장 완료! 인쇄 버튼을 눌러주세요.");
            document.getElementById('btn-print-receipt').classList.remove('hidden');
            document.getElementById('print-receipt-zone').classList.remove('hidden');
        }
    }

    async function loadContracts() {
        const kw = document.getElementById('search-keyword').value;
        let query = supabase.from('contracts').select('*').order('created_at', {ascending:false});
        if(kw) query = query.ilike('title', `%${kw}%`);
        const { data } = await query;
        
        let html = '<table style="width:100%; border-collapse:collapse; margin-top:20px; color:white;"><tr><th style="border:1px solid #334155; padding:10px;">번호</th><th style="border:1px solid #334155;">제목</th><th style="border:1px solid #334155;">파일</th></tr>';
        data.forEach(item => {
            html += `<tr><td style="border:1px solid #334155; padding:10px; text-align:center;">${item.doc_full}</td><td style="border:1px solid #334155; padding:10px;">${item.title}</td><td style="border:1px solid #334155; text-align:center;"><a href="${item.file_url}" target="_blank" style="color:#38bdf8;">보기</a></td></tr>`;
        });
        html += '</table>';
        document.getElementById('contract-list-target').innerHTML = html;
    }
</script>

</body>
</html>
