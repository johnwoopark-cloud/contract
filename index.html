<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계약서 보안 관리 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 18px; font-weight: bold; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }
        .page-section { display: none; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .page-section.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 4px; }
        
        button.btn-primary { background: var(--accent-color); color: #0f172a; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        button.btn-secondary { background: #10b981; color: white; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        
        .hidden { display: none !important; }

        /* ================= 인쇄용 양식 (사진 재현) ================= */
        #print-receipt-zone { display: none; background: white; color: black; padding: 40px; border: 1px solid #ccc; max-width: 900px; margin: 20px auto; }
        .print-header { font-size: 14px; font-weight: bold; margin-bottom: 10px; }
        .receipt-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .receipt-table th, .receipt-table td { border: 1px solid #000; padding: 8px 12px; color: black; font-size: 15px; text-align: left; }
        .receipt-table th { background-color: #fff; width: 180px; font-weight: bold; }
        .receipt-table td { background-color: #fff; }
        
        .flex-td { display: flex; justify-content: space-between; border: none !important; padding: 0 !important; }
        .flex-td span { flex: 1; border-right: 1px dotted #000; padding: 0 10px; text-align: center; }
        .flex-td span:last-child { border-right: none; }
        
        .req-mark::before { content: '■ '; color: #000; }

        @media print {
            body * { visibility: hidden; }
            #print-receipt-zone, #print-receipt-zone * { visibility: visible; }
            #print-receipt-zone { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none; }
            @page { size: A4 portrait; margin: 15mm; }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: right; margin-bottom: 10px;">
        <button id="btn-logout" class="hidden" onclick="handleLogoutClick()" style="background: none; border: none; color: #ef4444; cursor: pointer;">[로그아웃]</button>
    </div>

    <div id="login-section" style="max-width: 400px; margin: 100px auto; background: var(--panel-bg); padding: 40px; border-radius: 12px; text-align: center;">
        <h2 style="margin-bottom: 20px;">계약서 시스템 로그인</h2>
        <div class="form-group">
            <input type="email" id="login-email" placeholder="아이디(이메일)" required>
        </div>
        <div class="form-group">
            <input type="password" id="login-password" placeholder="비밀번호" required>
        </div>
        <button class="btn-primary" onclick="handleLogin()">인증 및 접속</button>
    </div>

    <div id="main-system" class="hidden">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('input')">계약서 등록 (입력)</button>
            <button class="tab-btn" onclick="switchTab('list')">목록 검색</button>
        </div>

        <div id="section-input" class="page-section active">
            <form id="contract-form" onsubmit="saveContract(event)">
                <div class="form-row">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>*기안문/문서번호/기안일자</label>
                        <div style="display:flex; gap:5px;">
                            <select id="doc_dept" required style="flex:1;">
                                <option value="미디어경">미디어경</option>
                                <option value="미디어전">미디어전</option>
                                <option value="미디어해">미디어해</option>
                                <option value="미디어국">미디어국</option>
                                <option value="미디어플">미디어플</option>
                                <option value="미디어제">미디어제</option>
                                <option value="미디어문">미디어문</option>
                                <option value="미디어감">미디어감</option>
                            </select>
                            <input type="number" id="doc_year" placeholder="2026" required style="flex:1;">
                            <input type="number" id="doc_num" placeholder="번호" required style="flex:0.7;">
                            <input type="date" id="draft_date" required style="flex:1.3;">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*기안자(소속/성함)</label>
                        <div style="display:flex; gap:5px;"><input type="text
