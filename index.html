<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계약서 보안 관리 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #94a3b8; font-size: 18px; font-weight: bold; padding: 10px 20px; cursor: pointer; }
        .tab-btn.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }
        .page-section { display: none; background: var(--panel-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .page-section.active { display: block; }

        #login-section { max-width: 400px; margin: 100px auto; background: var(--panel-bg); padding: 40px; border-radius: 12px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 6px; }
        .doc-num-box { display: flex; gap: 10px; align-items: center; }
        
        button.btn-primary { background: var(--accent-color); color: #0f172a; font-weight: bold; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        button.btn-secondary { background: #10b981; color: white; font-weight: bold; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        
        .search-bar { display: flex; gap: 15px; margin-bottom: 20px; }
        .table-wrapper { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { background: #0f172a; color: var(--accent-color); }
        
        .hidden { display: none !important; }

        /* ================= 이미지 양식 기반 인쇄 전용 스타일 리디자인 ================= */
        #print-receipt-zone { display: none; background: white; color: black; padding: 40px; max-width: 820px; margin: 20px auto; }
        .print-notice { font-size: 14px; font-weight: bold; margin-bottom: 10px; text-align: left; color: black; }
        
        .receipt-table { width: 100%; border-collapse: collapse; border: 2px solid #000; table-layout: fixed; }
        .receipt-table th, .receipt-table td { border: 1px solid #000 !important; padding: 12px 10px !important; color: black !important; background: none !important; font-size: 14px; vertical-align: middle; }
        .receipt-table th { width: 160px; font-weight: bold; text-align: center; }
        .receipt-table td { text-align: left; }
        .text-center { text-align: center !important; }
        .flex-td { display: flex; justify-content: border-box; padding: 0 !important; }
        .flex-td > div { flex: 1; padding: 12px 10px; text-align: center; }
        .flex-td > div:first-child { border-right: 1px solid #000; }

        /* ================= 프린트 아웃 시에만 작동하는 CSS 스타일 ================= */
        @media print {
            body { background: white !important; color: black !important; padding: 0; }
            .container, #main-system, .nav-tabs, #contract-form, .search-bar, .table-wrapper { display: none !important; }
            body * { visibility: hidden; } 
            #print-receipt-zone, #print-receipt-zone * { visibility: visible; } 
            #print-receipt-zone { display: block !important; position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; border: none; padding: 0; }
            .receipt-table { width: 100% !important; border: 2px solid #000 !important; }
            .receipt-table th, .receipt-table td { border: 1px solid #000 !important; }
            @page { size: A4 portrait; margin: 15mm 20mm; }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: right; margin-bottom: 10px;">
        <button id="btn-logout" class="hidden" style="background: none; border: none; color: #ef4444; cursor: pointer;">[로그아웃]</button>
    </div>

    <div id="login-section">
        <h2 style="margin-bottom: 20px;">계약서 시스템 로그인</h2>
        <div class="form-group">
            <input type="email" id="login-email" placeholder="아이디(이메일)" required>
        </div>
        <div class="form-group">
            <input type="password" id="login-password" placeholder="비밀번호" required>
        </div>
        <button class="btn-primary" onclick="handleLogin()">인증 및 접속</button>
    </div>

    <div id="main-system" class="hidden">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('input')">계약서 등록 (입력)</button>
            <button class="tab-btn" onclick="switchTab('list')">계약서 목록 및 검색 (출력)</button>
        </div>

        <div id="section-input" class="page-section active">
            <form id="contract-form" onsubmit="saveContract(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>*문서번호 (3분할)</label>
                        <div class="doc-num-box">
                            <select id="doc_dept" required style="flex: 2;">
                                <option value="">부서 선택</option>
                                <option value="미디어경">미디어경</option>
                                <option value="미디어전">미디어전</option>
                                <option value="미디어해">미디어해</option>
                                <option value="미디어국">미디어국</option>
                                <option value="미디어플">미디어플</option>
                                <option value="미디어드라마프로젝트">미디어드라마프로젝트</option>
                                <option value="미디어제">미디어제</option>
                                <option value="미디어문">미디어문</option>
                                <option value="미디어신사업프로젝트">미디어신사업프로젝트</option>
                                <option value="미디어디1">미디어디1</option>
                                <option value="미디어디2">미디어디2</option>
                                <option value="미디어감">미디어감</option>
                            </select>
                            <input type="number" id="doc_year" placeholder="연도(YYYY)" required style="flex: 2;">
                            <input type="number" id="doc_num" placeholder="번호" required style="flex: 1.5;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>*제목</label>
                        <input type="text" id="title" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*기안자</label><input type="text" id="drafter" required></div>
                    <div class="form-group"><label>*검토자</label><input type="text" id="reviewer" required></div>
                    <div class="form-group"><label>*최종결재자</label><input type="text" id="approver" required></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*날인일자</label><input type="date" id="sign_date" required></div>
                    <div class="form-group"><label>*날인번호</label><input type="text" id="sign_num" required></div>
                    <div class="form-group"><label>계약유형</label><input type="text" id="contract_type"></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*상대방 1</label><input type="text" id="party_1" required></div>
                    <div class="form-group"><label>상대방 2 (선택)</label><input type="text" id="party_2"></div>
                    <div class="form-group"><label>상대방 3 (선택)</label><input type="text" id="party_3"></div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*계약개시일자</label><input type="date" id="start_date" required></div>
                    <div class="form-group"><label>*계약종료일자(조건)</label><input type="text" id="end_date" required></div>
                    <div class="form-group"><label>계약금액 (KRW)</label><input type="number" id="amount"></div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 30px;">
                        <input type="checkbox" id="auto_renew" style="width: 20px; height: 20px;" onchange="toggleNoticePeriod()">
                        <label for="auto_renew" style="margin: 0; cursor: pointer;">*자동갱신 여부</label>
                    </div>
                    <div class="form-group" id="notice-group">
                        <label>갱신 통보 일자(조건)</label>
                        <input type="text" id="notice_period" placeholder="예: 2심 항소 기간 이내">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group"><label>*원본 날인자</label><input type="text" id="original_signer" required></div>
                    <div class="form-group"><label>*원본 보관자</label><input type="text" id="original_keeper" required></div>
                    <div class="form-group"><label>*파일 작성자</label><input type="text" id="file_creator" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>*파일 보관자</label><input type="text" id="file_keeper" required></div>
                    <div class="form-group"><label>*양식 작성시점 관리자 1</label><input type="text" id="manager_1" placeholder="예: 팀장 이케미" required></div>
                    <div class="form-group"><label>*양식 작성시점 관리자 2</label><input type="text" id="manager_2" placeholder="예: 부서장 홍케미" required></div>
                </div>

                <div class="form-group" style="background: #0f172a; padding: 20px; border-radius: 6px;">
                    <label>*계약서 사본 파일 첨부 (PDF / 이미지)</label>
                    <input type="file" id="contract_file" required>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="btn-primary" id="btn-save">계약서 정보 시스템 등록 (저장)</button>
                    <button type="button" class="btn-secondary hidden" id="btn-print-receipt" onclick="printCurrentContract()">🖨️ 등록 내용 인쇄</button>
                </div>
            </form>
            
            <div id="print-receipt-zone" class="hidden">
                <div class="print-notice">* 표시된 항목은 필수 입력임</div>
                <table class="receipt-table">
                    <tr>
                        <th class="text-center">기안문</th>
                        <td class="flex-td">
                            <div id="p-doc-code"></div>
                            <div id="p-doc-date"></div>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-center">기안자*</th>
                        <td id="p-drafter"></td>
                    </tr>
                    <tr>
                        <th class="text-center">검토자*</th>
                        <td id="p-reviewer"></td>
                    </tr>
                    <tr>
                        <th class="text-center">최종 결재자*</th>
                        <td id="p-approver"></td>
                    </tr>
                    <tr>
                        <th class="text-center">계약 제목*</th>
                        <td id="p-title" style="font-weight: bold;"></td>
                    </tr>
                    <tr>
                        <th class="text-center">계약 상대방*</th>
                        <td class="flex-td">
                            <div id="p-party1"></div>
                            <div id="p-party2"></div>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-center">계약 개시일*</th>
                        <td id="p-start-date"></td>
                    </tr>
                    <tr>
                        <th class="text-center">계약 종료일*<br>(종료 조건)</th>
                        <td id="p-end-date"></td>
                    </tr>
                    <tr>
                        <th class="text-center">자동갱신 여부*</th>
                        <td class="flex-td">
                            <div id="p-renew-y">Y ☐</div>
                            <div id="p-renew-n">N ☐</div>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-center">갱신 통보 일자</th>
                        <td id="p-notice-period"></td>
                    </tr>
                    <tr>
                        <th class="text-center">원본 날인자*</th>
                        <td id="p-original-signer"></td>
                    </tr>
                    <tr>
                        <th class="text-center">날인 일자 및 일련번호*</th>
                        <td class="flex-td">
                            <div id="p-sign-date"></div>
                            <div id="p-sign-num"></div>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-center">원본 보관자*</th>
                        <td id="p-original-keeper"></td>
                    </tr>
                    <tr>
                        <th class="text-center">파일 작성자*</th>
                        <td id="p-file-creator"></td>
                    </tr>
                    <tr>
                        <th class="text-center">파일 보관자*</th>
                        <td id="p-file-keeper"></td>
                    </tr>
                    <tr>
                        <th class="text-center">양식 작성일*</th>
                        <td id="p-created-date" class="text-center"></td>
                    </tr>
                    <tr>
                        <th class="text-center">양식 작성시점 관리자*</th>
                        <td class="flex-td">
                            <div id="p-manager1"></div>
                            <div id="p-manager2"></div>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div id="section-list" class="page-section">
            <div class="search-bar">
                <input type="text" id="search-keyword" placeholder="제목, 상대방, 기안자 통합 키워드 검색..." style="flex: 4;">
                <button class="btn-primary" style="flex: 1;" onclick="loadContracts()">검색</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>문서번호</th>
                            <th>제목</th>
                            <th>상대방</th>
                            <th>계약기간</th>
                            <th>기안/검토/결재</th>
                            <th>날인 정보</th>
                            <th>파일</th>
                        </tr>
                    </thead>
                    <tbody id="contract-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_PROJECT_URL = "https://dqdcoisbtqbkytzvyfct.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_iAeHQcv6_WxXqQvZ3FLWWg_7xN66R6O";
    
    const supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_PUBLISHABLE_KEY);
    let lastSavedContract = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) { showSystem(); }
    });

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
        
        if (type === 'input') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('section-input').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('section-list').classList.add('active');
            loadContracts();
        }
    }

    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        if(!email || !password) return alert("아이디와 비밀번호를 모두 입력해주세요.");

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert("인증 오류: " + error.message);
        else showSystem();
    }

    document.getElementById('btn-logout').onclick = async () => {
        await supabaseClient.auth.signOut();
        location.reload();
    };

    function showSystem() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('main-system').classList.remove('hidden');
        document.getElementById('btn-logout').classList.remove('hidden');
    }

    function toggleNoticePeriod() {
        // 기존 토글 기능 유지 (필요에 따라 입력 폼 제어 가능)
    }

    async function saveContract(e) {
        e.preventDefault();
        const fileInput = document.getElementById('contract_file');
        const file = fileInput.files[0];
        if (!file) return alert("사본 파일을 첨부해 주세요.");

        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const filePath = `contracts/${fileName}`;

        const { data: storageData, error: storageError } = await supabaseClient.storage
            .from('contract-files')
            .upload(filePath, file);

        if (storageError) return alert("파일 업로드 오류: " + storageError.message);
        const { data: { publicUrl } } = supabaseClient.storage.from('contract-files').getPublicUrl(filePath);

        const today = new Date();
        const formattedToday = `${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}`;

        const contractData = {
            doc_dept: document.getElementById('doc_dept').value,
            doc_year: parseInt(document.getElementById('doc_year').value),
            doc_num: parseInt(document.getElementById('doc_num').value),
            title: document.getElementById('title').value,
            drafter: document.getElementById('drafter').value,
            reviewer: document.getElementById('reviewer').value,
            approver: document.getElementById('approver').value,
            sign_date: document.getElementById('sign_date').value,
            sign_num: document.getElementById('sign_num').value,
            contract_type: document.getElementById('contract_type').value,
            party_1: document.getElementById('party_1').value,
            party_2: document.getElementById('party_2').value || null,
            party_3: document.getElementById('party_3').value || null,
            start_date: document.getElementById('start_date').value,
            end_date: document.getElementById('end_date').value,
            auto_renew: document.getElementById('auto_renew').checked,
            notice_period: document.getElementById('notice_period').value || '-',
            original_signer: document.getElementById('original_signer').value,
            original_keeper: document.getElementById('original_keeper').value,
            file_creator: document.getElementById('file_creator').value,
            file_keeper: document.getElementById('file_keeper').value,
            manager_1: document.getElementById('manager_1').value,
            manager_2: document.getElementById('manager_2').value,
            file_url: publicUrl,
            created_date_str: formattedToday
        };

       // 🌟 [여기서 수정] DB 테이블 스키마에 존재하지 않는 필드는 제거하고 전달합니다.
        const { created_date_str, ...dbPayload } = contractData;

        // 기존 contractData 대신 dbPayload를 insert에 전달합니다.
        const { error: dbError } = await supabaseClient.from('contracts').insert([dbPayload]);

        if (dbError) {
            alert("DB 저장 오류: " + dbError.message);
        } else {
            alert("계약서가 성공적으로 등록되었습니다.\n[등록 내용 인쇄] 버튼을 누르면 서식 양식으로 출력됩니다.");
            
            lastSavedContract = contractData;
            // ... (하단 출력 매핑 로직은 그대로 유지) ...
        } else {
            alert("계약서가 성공적으로 등록되었습니다.\n[등록 내용 인쇄] 버튼을 누르면 서식 양식으로 출력됩니다.");
            
            lastSavedContract = contractData;

            // 데이터 바인딩 연산 - 제공된 대장 이미지 서식 구조 매핑
            document.getElementById('p-doc-code').innerText = `${contractData.doc_dept}${contractData.doc_year}-${String(contractData.doc_num).padStart(5, '0')}`;
            document.getElementById('p-doc-date').innerText = contractData.sign_date.replace(/-/g, '.');
            document.getElementById('p-drafter').innerText = contractData.drafter;
            document.getElementById('p-reviewer').innerText = contractData.reviewer;
            document.getElementById('p-approver').innerText = contractData.approver;
            document.getElementById('p-title').innerText = contractData.title;
            
            document.getElementById('p-party1').innerText = contractData.party_1;
            document.getElementById('p-party2').innerText = contractData.party_2 || '-';
            
            document.getElementById('p-start-date').innerText = contractData.start_date.replace(/-/g, '.');
            document.getElementById('p-end-date').innerText = contractData.end_date; // 조건형 텍스트 대응 가능하도록 유지
            
            // 체크박스 특수문자 로직 변경 (Y / N 분기 표시)
            if (contractData.auto_renew) {
                document.getElementById('p-renew-y').innerHTML = "Y ■";
                document.getElementById('p-renew-n').innerHTML = "N ☐";
            } else {
                document.getElementById('p-renew-y').innerHTML = "Y ☐";
                document.getElementById('p-renew-n').innerHTML = "N ■";
            }

            document.getElementById('p-notice-period').innerText = contractData.notice_period;
            document.getElementById('p-original-signer').innerText = contractData.original_signer;
            
            document.getElementById('p-sign-date').innerText = contractData.sign_date.replace(/-/g, '.');
            document.getElementById('p-sign-num').innerText = String(contractData.sign_num).padStart(3, '0');
            
            document.getElementById('p-original-keeper').innerText = contractData.original_keeper;
            document.getElementById('p-file-creator').innerText = contractData.file_creator;
            document.getElementById('p-file-keeper').innerText = contractData.file_keeper;
            document.getElementById('p-created-date').innerText = contractData.created_date_str;
            
            document.getElementById('p-manager1').innerText = contractData.manager_1;
            document.getElementById('p-manager2').innerText = contractData.manager_2;

            document.getElementById('btn-print-receipt').classList.remove('hidden');
            document.getElementById('print-receipt-zone').classList.remove('hidden');
        }
    }

    function printCurrentContract() {
        if (!lastSavedContract) return alert("출력할 저장 완료 데이터가 기록되지 않았습니다.");
        window.print();
    }

    async function loadContracts() {
        const keyword = document.getElementById('search-keyword').value;
        let query = supabaseClient.from('contracts').select('*');

        if (keyword) {
            query = query.or(`title.ilike.%${keyword}%,party_1.ilike.%${keyword}%,drafter.ilike.%${keyword}%`);
        }

        const { data, error } = await query.order('created_at', { ascending: false });
        if (error) return alert("데이터 로딩 오류: " + error.message);

        const tbody = document.getElementById('contract-table-body');
        tbody.innerHTML = "";

        data.forEach(item => {
            const parties = [item.party_1, item.party_2].filter(Boolean).join(', ');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.doc_dept}-${item.doc_year}-${item.doc_num}</b></td>
                <td>${item.title}</td>
                <td>${parties}</td>
                <td><small>${item.start_date} ~ ${item.end_date}</small></td>
                <td><small>${item.drafter} / ${item.reviewer} / ${item.approver}</small></td>
                <td><small>${item.sign_date} (${item.sign_num})</small></td>
                <td><a href="${item.file_url}" target="_blank" style="color:var(--accent-color); text-decoration:none;">💾 보기</a></td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
